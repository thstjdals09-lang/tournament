<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holdem TD</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <div class="topbar-row">
    <button id="btnHome" class="home-btn">이벤트 목록</button>
    <span class="home-title">Holdem TD</span>
    <select id="eventSelect" class="event-select" title="이벤트 선택"></select>

  </div>

<main id="view"></main>

<nav id="tabbar">

  <a href="#dealers" data-tab="dealers">딜러</a>
  <a href="#events" data-tab="events">현황</a>
  <a href="#print" data-tab="print">용지</a>
</nav>

<div id="toast"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="print-root"></div>
<div id="board" class="board hidden"></div>

<script src="js/store.js"></script>
<script src="js/logic.js"></script>
<script src="js/floor.js"></script>
<script src="js/print.js"></script>

</html>
